name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to upload the release file

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true          # keeps Flutter between runs

      - run: flutter pub get

      # Shows Dart errors in seconds, before the slow Xcode build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}

      - name: Make IPA
        run: |
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/ios/iphoneos/FlutterIpaExport.ipa

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "Latest build"
